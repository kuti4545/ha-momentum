name: HA Momentum

on:
  schedule:
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ha-momentum
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tara
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_SYMBOLS: "180"
          MIN_VOLUME: "1500000"
        run: python scan.py
      - name: Kaydet
        run: |
          git config user.name "ha-mom"
          git config user.email "ha-mom@users.noreply.github.com"
          mkdir -p docs
          git add docs/ha_state.json || true
          if git diff --cached --quiet; then echo yok; else git commit -m "ha-state" && git push; fi
